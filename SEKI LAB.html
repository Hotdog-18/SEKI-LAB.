<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>SEKI LAB.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: lab-plate look. Wordmark on top, a well-plate style seat grid (A-E rows, 1-5 columns) under a FRONT bar, swipeable slides for each round, then actions. On wide tablets the settings sit in a right column. */
:root {
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  --bg: #eff3f1;
  --panel: #ffffff;
  --well: #f7faf8;
  --ink: #0f1a17;
  --ink-soft: #5a6a64;
  --line: #d2dbd7;
  --line-strong: #aebcb6;
  --accent: #ff5b14;
  --accent-ink: #0f1a17;
  --fixed: #0f7a63;
  --warn: #b3341a;
  --focus: #1f6feb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311;
    --panel: #151d1a;
    --well: #1b2521;
    --ink: #e8f0ec;
    --ink-soft: #9db0a8;
    --line: #2b3833;
    --line-strong: #44544d;
    --accent: #ff7a3d;
    --accent-ink: #0d1311;
    --fixed: #5fd1b0;
    --warn: #ff9b7a;
    --focus: #8fbaff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311;
  --panel: #151d1a;
  --well: #1b2521;
  --ink: #e8f0ec;
  --ink-soft: #9db0a8;
  --line: #2b3833;
  --line-strong: #44544d;
  --accent: #ff7a3d;
  --accent-ink: #0d1311;
  --fixed: #5fd1b0;
  --warn: #ff9b7a;
  --focus: #8fbaff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
button, input, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  text-align: center;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 24px; }
.main { display: grid; gap: 16px; min-width: 0; align-content: start; }
@media (min-width: 980px) {
  .wrap { grid-template-columns: minmax(0, 1fr) 330px; align-items: start; }
  header.top { grid-column: 1 / -1; }
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; text-align: center; gap: 4px 16px; }
.mark {
  margin: 0;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: clamp(2rem, 7vw, 2.8rem);
  line-height: 1.1;
  letter-spacing: .02em;
}
.mark .dot { color: var(--accent); }
.tagline { margin: 0; color: var(--ink-soft); font-size: .92rem; }

.langrow { flex: 0 0 100%; display: flex; justify-content: center; margin-top: 6px; }
.langrow .seg button { min-height: 40px; font-size: .85rem; padding: .3rem .9rem; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; text-align: center; }
.seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: .95rem;
  min-height: 46px;
  padding: .4rem 1rem;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.meta { margin: 0; font-size: .88rem; color: var(--ink-soft); min-width: 0; flex: 0 1 auto; text-align: center; }
.meta .warn { color: var(--warn); font-weight: 700; }

.statusrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; text-align: center; gap: 8px 12px; }
.status {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: .88rem;
  line-height: 1;
  padding: .55rem .8rem;
  border-radius: 8px;
  border: 1.5px solid var(--line-strong);
  background: var(--panel);
  font-variant-numeric: tabular-nums;
}
.status[hidden] { display: none; }
.status.live { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hint { margin: 0; font-size: .88rem; color: var(--ink-soft); flex: 0 1 auto; min-width: 0; }
.hint:empty { display: none; }

.nav { display: flex; align-items: center; gap: 8px; }
.nav[hidden] { display: none; }
.nav .arrow {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 10px;
  border: 1.5px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink);
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
}
.nav .arrow:disabled { opacity: .35; cursor: not-allowed; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; justify-content: center; }
.tab {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: .95rem;
  min-width: 52px;
  min-height: 46px;
  padding: .3rem .8rem;
  border-radius: 10px;
  border: 1.5px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink-soft);
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* plate */
.front, .rear { width: 100%; max-width: 780px; margin-inline: auto; text-align: center; }
.front {
  background: var(--ink);
  color: var(--panel);
  font-weight: 700;
  font-size: .85rem;
  letter-spacing: .35em;
  padding: .55rem .5rem .55rem calc(.5rem + .35em);
  border-radius: 6px;
}
.rear { color: var(--ink-soft); font-size: .85rem; letter-spacing: .3em; margin-top: -4px; }

.track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }

.plate {
  --gap: 6px;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: var(--gap);
  container-type: inline-size;
  width: 100%;
  max-width: 780px;
  margin-inline: auto;
}
@media (min-width: 700px) { .plate { --gap: 10px; } }
.ax {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: .8rem;
  color: var(--ink-soft);
  display: grid;
  place-items: center;
  min-height: 1.2rem;
  font-variant-numeric: tabular-nums;
}

.seat {
  --fs: clamp(12px, calc((100cqw - var(--cols) * var(--gap)) / var(--cols) * .46), 54px);
  position: relative;
  overflow: hidden;
  min-width: 0;
  aspect-ratio: 1 / .86;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line-strong);
  border-radius: 10px;
  background: var(--panel);
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: var(--fs);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  user-select: none;
  -webkit-user-select: none;
}
button.seat { cursor: pointer; }
.seat.empty { color: var(--ink-soft); background: var(--well); }
.seat.empty .num { font-family: var(--font-body); font-size: .55em; font-weight: 500; }
.seat.off { background: transparent; border-style: dashed; border-color: var(--line); color: var(--ink-soft); }
.seat.off .num { font-weight: 500; }
.seat.fixed { border-color: var(--fixed); border-width: 2px; }
.seat.fixed::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 28%;
  aspect-ratio: 1;
  background: var(--fixed);
  clip-path: polygon(0 0, 100% 0, 100% 100%);
}
.seat.rolling { background: var(--well); color: var(--ink-soft); }
.seat.sel { outline: 3px solid var(--focus); outline-offset: 2px; }
.seat.hit { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seat.pop { animation: pop .45s ease-out; }
@keyframes pop {
  0% { transform: scale(.78); background: var(--accent); }
  55% { transform: scale(1.1); }
  100% { transform: scale(1); background: var(--panel); }
}
@media (prefers-reduced-motion: reduce) { .seat.pop { animation: none; } }

.editor { display: grid; gap: 10px; padding: 14px; border: 1.5px solid var(--fixed); border-radius: 12px; background: var(--panel); }
.editor[hidden] { display: none; }
.ed-title { margin: 0; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.rounds { flex: 0 0 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rounds .lab { font-size: .9rem; }
.btn {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1rem;
  min-height: 50px;
  padding: .6rem 1.2rem;
  border-radius: 12px;
  border: 1.5px solid var(--ink);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
.btn.small { min-height: 46px; font-size: .95rem; padding: .4rem .9rem; }
.btn.primary {
  flex: 1 1 220px;
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-size: 1.2rem;
  min-height: 60px;
}
.btn.confirm { background: var(--ink); color: var(--panel); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.note { margin: 0; min-height: 1.6em; color: var(--ink-soft); }
.note.warn { color: var(--warn); font-weight: 700; }

.find { display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; }
.find label { font-weight: 700; font-size: .9rem; }
.find output { color: var(--ink-soft); font-size: .92rem; min-width: 0; }

input[type="number"], textarea {
  font-family: var(--font-mono);
  font-size: 16px;
  color: var(--ink);
  background: var(--panel);
  border: 1.5px solid var(--line-strong);
  border-radius: 8px;
  padding: .5rem .7rem;
  min-height: 46px;
}
input[type="number"] { width: 6.5rem; }
textarea { width: 100%; text-align: left; min-height: 72px; resize: vertical; font-size: 14px; word-break: break-all; }

/* settings */
.settings { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 20px 18px; display: grid; gap: 20px; min-width: 0; }
.settings h2 { margin: 0; font-family: var(--font-mono); font-size: 1rem; letter-spacing: .08em; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px 24px; }
.field { display: grid; gap: 6px; align-content: start; justify-items: center; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.lab { font-weight: 700; font-size: .9rem; }
.sub { font-size: .85rem; color: var(--ink-soft); }
.stepper { display: inline-flex; align-items: center; justify-self: center; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--panel); }
.stepper button { width: 48px; height: 46px; border: 0; background: transparent; color: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 1.3rem; cursor: pointer; }
.stepper output { min-width: 3em; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.field .seg { justify-self: center; }
.switch { display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; font-weight: 700; min-height: 46px; }
.switch input {
  appearance: none;
  -webkit-appearance: none;
  flex: none;
  position: relative;
  width: 54px;
  height: 32px;
  margin: 0;
  border-radius: 999px;
  background: var(--line-strong);
  cursor: pointer;
  transition: background .15s;
}
.switch input::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--panel);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  transition: transform .15s;
}
.switch input:checked { background: var(--fixed); }
.switch input:checked::before { transform: translateX(22px); }
details.rec { display: grid; gap: 10px; }
details.rec summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; justify-content: center; }
details.rec[open] summary { margin-bottom: 6px; }
body.busy .settings, body.busy .toolbar, body.busy .nav, body.busy .find { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="mark">SEKI LAB<span class="dot">.</span></h1>
    <p class="tagline">出席番号で回す、席替え抽選</p>
    <div class="langrow">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button type="button" data-v="ja" aria-pressed="true">日本語</button>
        <button type="button" data-v="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <div class="seg" id="modeSeg" role="group" aria-label="表示と編集の切り替え">
        <button type="button" data-v="view" aria-pressed="true">席を見る</button>
        <button type="button" data-v="seats" aria-pressed="false">席の有無</button>
        <button type="button" data-v="fixed" aria-pressed="false">固定席</button>
      </div>
      <p class="meta" id="meta"></p>
    </div>

    <div class="statusrow">
      <span class="status" id="status">見本の席</span>
      <p class="hint" id="hint"></p>
    </div>

    <nav class="nav" id="nav" aria-label="案の切り替え" hidden></nav>

    <div class="front" aria-hidden="true">黒板</div>
    <div id="stageHost"></div>
    <div class="rear" aria-hidden="true">後ろ</div>

    <div class="editor" id="editor" hidden>
      <p class="ed-title" id="edLabel"></p>
      <div class="row">
        <label for="fxNum">固定する出席番号</label>
        <input id="fxNum" type="number" inputmode="numeric" min="1" max="60">
        <button class="btn small" id="fxSet" type="button">固定する</button>
        <button class="btn small" id="fxClear" type="button">この席の固定を解除</button>
      </div>
    </div>

    <div class="actions">
      <div class="rounds">
        <span class="lab" id="lab-rounds">連続で回す</span>
        <div class="stepper" data-k="rounds" role="group" aria-labelledby="lab-rounds">
          <button type="button" data-d="-1" aria-label="回数を1回減らす">−</button>
          <output id="out-rounds">3</output>
          <button type="button" data-d="1" aria-label="回数を1回増やす">＋</button>
        </div>
      </div>
      <button class="btn primary" id="start" type="button">3回まわす</button>
      <button class="btn confirm" id="confirm" type="button" hidden>この案で確定</button>
    </div>
    <p class="note" id="note" role="status" aria-live="polite"></p>

    <div class="find">
      <label for="find">番号で探す</label>
      <input id="find" type="number" inputmode="numeric" min="1" max="60" placeholder="例 12">
      <output id="findOut" for="find"></output>
    </div>
  </main>

  <aside class="settings" id="settings" aria-labelledby="setH">
    <h2 id="setH">SETTINGS</h2>
    <div class="fields">
      <div class="field">
        <span class="lab" id="lab-n">人数</span>
        <div class="stepper" data-k="n" role="group" aria-labelledby="lab-n">
          <button type="button" data-d="-1" aria-label="人数を1人減らす">−</button>
          <output id="out-n">25</output>
          <button type="button" data-d="1" aria-label="人数を1人増やす">＋</button>
        </div>
        <span class="sub">1番から順に抽選します</span>
      </div>
      <div class="field">
        <span class="lab" id="lab-cols">横の席数（列）</span>
        <div class="stepper" data-k="cols" role="group" aria-labelledby="lab-cols">
          <button type="button" data-d="-1" aria-label="列を1つ減らす">−</button>
          <output id="out-cols">5</output>
          <button type="button" data-d="1" aria-label="列を1つ増やす">＋</button>
        </div>
      </div>
      <div class="field">
        <span class="lab" id="lab-rows">縦の席数（行）</span>
        <div class="stepper" data-k="rows" role="group" aria-labelledby="lab-rows">
          <button type="button" data-d="-1" aria-label="行を1つ減らす">−</button>
          <output id="out-rows">5</output>
          <button type="button" data-d="1" aria-label="行を1つ増やす">＋</button>
        </div>
      </div>
      <div class="field">
        <span class="lab" id="lab-style">抽選の見せ方</span>
        <div class="seg" id="styleSeg" role="group" aria-labelledby="lab-style">
          <button type="button" data-v="one" aria-pressed="true">ひとつずつ</button>
          <button type="button" data-v="all" aria-pressed="false">一気に</button>
        </div>
      </div>
      <div class="field">
        <span class="lab" id="lab-fixed">固定席</span>
        <span class="sub" id="fixedState">固定している人はいません</span>
        <button class="btn small" id="fixedClear" type="button" style="justify-self:center">固定席をすべて解除</button>
      </div>
      <div class="field wide">
        <label class="switch"><input id="avoid" type="checkbox"><span>前回と同じ席を避ける</span></label>
        <span class="sub" id="prevState">前回の記録：なし</span>
      </div>
    </div>

    <details class="rec">
      <summary>前回の記録をコードで持ち運ぶ</summary>
      <p class="sub" style="margin:0">確定すると、この端末のブラウザに記録されます。別の端末で使うときは、コードをコピーして貼り付けてください。</p>
      <label for="code" class="lab">記録コード</label>
      <textarea id="code" spellcheck="false" placeholder="SK1|5|5|…"></textarea>
      <div class="row">
        <button class="btn small" id="codeMake" type="button">表示中の席をコードにしてコピー</button>
        <button class="btn small" id="codeLoad" type="button">このコードを前回の記録にする</button>
        <button class="btn small" id="codeClear" type="button">前回の記録を消す</button>
      </div>
      <p class="note" id="codeNote" role="status" aria-live="polite"></p>
    </details>
  </aside>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var STORE = 'seki-lab:v1';
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var LIM = { n: [1, 60], cols: [1, 12], rows: [1, 10], rounds: [1, 8] };

  var S = {
    cols: 5, rows: 5, n: 25, rounds: 3, style: 'one', avoid: false,
    disabled: new Set(), fixed: new Map(), prev: null, avoidSrc: null,
    slides: [], cur: 0, kind: 'sample', mode: 'view', selected: -1, find: 0,
    drawing: false, progress: '', lang: 'ja'
  };
  var slideCells = [];
  var scrollQueued = false;

  /* texts: Japanese and English */
  var D = {
    ja: {
      tagline: '出席番号で回す、席替え抽選',
      mode_view: '席を見る', mode_seats: '席の有無', mode_fixed: '固定席',
      front: '黒板', rear: '後ろ',
      fx_label: '固定する出席番号', fx_set: '固定する', fx_clear: 'この席の固定を解除',
      rounds_lab: '連続で回す',
      people_lab: '人数', people_sub: '1番から順に抽選します',
      cols_lab: '横の席数（列）', rows_lab: '縦の席数（行）',
      style_lab: '抽選の見せ方', style_one: 'ひとつずつ', style_all: '一気に',
      fixed_lab: '固定席', fixed_clear: '固定席をすべて解除',

    var multi = S.mode === 'view' && S.slides.length > 1;
    nav.hidden = !multi;
    if (!multi) { nav.replaceChildren(); return; }
    var prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'arrow'; prev.textContent = '‹';
    prev.setAttribute('aria-label', T('a_prev')); prev.dataset.go = 'prev';
    prev.disabled = S.cur === 0;
    var next = document.createElement('button');
    next.type = 'button'; next.className = 'arrow'; next.textContent = '›';
    next.setAttribute('aria-label', T('a_next')); next.dataset.go = 'next';
    next.disabled = S.cur === S.slides.length - 1;
    var tabs = document.createElement('div');
    tabs.className = 'tabs';
    tabs.setAttribute('role', 'group');
    tabs.setAttribute('aria-label', T('a_pick'));
    S.slides.forEach(function (g, idx) {
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'tab'; t.dataset.tab = String(idx);
      t.textContent = letter(idx);
      t.setAttribute('aria-pressed', idx === S.cur ? 'true' : 'false');
      t.setAttribute('aria-selected', idx === S.cur ? 'true' : 'false');
      tabs.appendChild(t);
    });
    nav.replaceChildren(prev, tabs, next);
  }

  function renderStatus() {
    var st = $('#status');
    var txt;
    if (S.drawing) txt = S.progress;
    else if (S.mode !== 'view') txt = T('st_setup');
    else if (S.kind === 'sample') txt = '';
    else if (S.kind === 'prev') txt = T('st_prev');
    else if (S.kind === 'confirmed') txt = T('st_confirmed');
    else txt = S.slides.length > 1 ? T('st_pending_n', letter(S.cur)) : T('st_pending_one');
    st.textContent = txt;
    st.hidden = !txt;
    st.classList.toggle('live', S.drawing);
  }

  function renderMeta() {
    var en = enabledSeats().length;
    var cs = [];
    var fx = validFixedCount();
    if (fx) cs.push(T('cond_fixed', fx));
    if (S.avoid) cs.push(S.avoidSrc ? T('cond_avoid') : T('cond_avoid_none'));
    var html = T('meta_head', S.n, en);
    if (en < S.n) html += T('meta_short', S.n - en);
    else if (en > S.n) html += T('meta_spare', en - S.n);
    html += T('sep') + (cs.length ? cs.join(T('join')) : T('cond_random'));
    $('#meta').innerHTML = html;
  }

  function renderEditor() {
    var ed = $('#editor');
    var show = S.mode === 'fixed' && S.selected >= 0 && S.selected < total() && !isOff(S.selected);
    ed.hidden = !show;
    if (!show) return;
    $('#edLabel').textContent = T('sel_seat') + seatName(S.selected);
    var fx = S.fixed.get(keyOf(S.selected));
    $('#fxNum').max = String(S.n);
    $('#fxNum').value = fx ? String(fx) : '';
    $('#fxClear').disabled = !fx;
  }

  function setPressed(id, val) {
    var btns = document.querySelectorAll(id + ' button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].dataset.v === val ? 'true' : 'false');
  }

  function renderConfirm() {
    var c = $('#confirm');
    c.hidden = !(S.kind === 'drawn' && !S.drawing && S.mode === 'view');
    c.textContent = S.slides.length > 1 ? T('confirm_n', letter(S.cur)) : T('confirm_one');
  }

  function renderControls() {
    setPressed('#modeSeg', S.mode);
    setPressed('#styleSeg', S.style);
    $('#out-n').textContent = S.n;
    $('#out-cols').textContent = S.cols;
    $('#out-rows').textContent = S.rows;
    $('#out-rounds').textContent = S.rounds;
    $('#avoid').checked = S.avoid;
    var ps = S.avoidSrc ? T('prev_yes', S.avoidSrc.pos.size) : T('prev_none');
    if (S.avoidSrc && (S.avoidSrc.cols !== S.cols || S.avoidSrc.rows !== S.rows)) ps += T('prev_mismatch');
    $('#prevState').textContent = ps;
    var fx = validFixedCount();
    $('#fixedState').textContent = fx ? T('fixed_n', fx) : T('fixed_none');
    $('#fixedClear').disabled = !fx;
    var hints = {
      view: '',
      seats: T('hint_seats'),
      fixed: T('hint_fixed')
    };
    $('#hint').textContent = (S.mode === 'view' && S.slides.length > 1 && !S.drawing) ? T('hint_swipe') : hints[S.mode];
    var short = enabledSeats().length < S.n;
    $('#start').disabled = S.drawing || short;
    $('#start').textContent = S.rounds === 1 ? T('draw_one') : T('draw_n', S.rounds);
    document.body.classList.toggle('busy', S.drawing);
    renderStatus();
    renderConfirm();
    if (short && !S.drawing) note(T('short'), true);
  }

  function updateFind() {
    var raw = $('#find').value;
    var out = $('#findOut');
    if (raw === '') { out.textContent = ''; return; }
    if (S.mode !== 'view') { out.textContent = T('find_mode'); return; }
    var v = Number(raw);
    var g = S.slides[S.cur];
    var i = (g && v > 0) ? g.indexOf(v) : -1;
    var pre = S.slides.length > 1 ? letter(S.cur) + T('colon') : '';
    out.textContent = i >= 0 ? pre + T('find_hit', v, seatName(i)) : pre + T('find_none', raw);
  }

  function renderAll() {
    S.find = $('#find').value === '' ? 0 : Number($('#find').value);
    renderMeta();
    renderStage();
    renderNav();
    renderEditor();
    renderControls();
    updateFind();
  }

  function note(msg, warn) {
    var n = $('#note');
    n.textContent = msg || '';
    n.classList.toggle('warn', !!warn);
  }

  function changed(msg) {
    makeSample();
    save();
    renderAll();
    note(msg || '');
  }

  /* when people outnumber seats, add a row, then a column, then a row again, and so on */
  function autoAdd() {
    var rowsAdded = 0, colsAdded = 0;
    var nextRow = true;
    while (enabledSeats().length < S.n) {
      var canRow = S.rows < LIM.rows[1], canCol = S.cols < LIM.cols[1];
      if (!canRow && !canCol) break;
      if ((nextRow && canRow) || !canCol) { S.rows++; rowsAdded++; }
      else { S.cols++; colsAdded++; }
      nextRow = !nextRow;
    }
    var parts = [];
    if (rowsAdded) parts.push(T('add_rows', rowsAdded));
    if (colsAdded) parts.push(T('add_cols', colsAdded));
    if (!parts.length) return '';
    var msg = T('add_msg', parts);
    if (enabledSeats().length < S.n) msg += T('add_more');
    return msg;
  }

  function prune() {
    Array.from(S.disabled).forEach(function (k) { if (!validKey(k)) S.disabled.delete(k); });
    Array.from(S.fixed).forEach(function (p) { if (!validKey(p[0]) || p[1] > S.n) S.fixed.delete(p[0]); });
    S.selected = -1;
  }

  /* the draw: several rounds in a row, each becomes a slide */
  async function startDraw() {
    if (S.drawing) return;
    var N = S.rounds;
    var results = [];
    for (var r = 0; r < N; r++) {
      var res = computeDraw(S.avoid);
      if (!res.grid) { note(res.error, true); return; }
      results.push(res);
    }
    S.drawing = true; S.mode = 'view'; S.selected = -1; S.slides = []; S.cur = 0; S.kind = 'drawn';
    note('');

    for (var p = 0; p < N; p++) {
      S.slides.push(results[p].grid);
      S.progress = N > 1 ? T('prog_n', p + 1, N) : T('prog_one');
      S.cur = Math.max(0, p - 1);
      renderAll();
      if (p > 0) { goTo(p, true); await sleep(reduce ? 0 : 450); } else S.cur = 0;
      var grid = results[p].grid;
      var cells = slideCells[p];
      var roll = [];
      for (var i = 0; i < total(); i++) {
        if (isOff(i)) continue;
        var fx = S.fixed.get(keyOf(i));
        if (fx && fx <= S.n && grid[i] === fx) continue;
        roll.push(i);
      }
      var locked = new Set();
      roll.forEach(function (i2) {
        cells[i2].el.classList.add('rolling');
        cells[i2].el.classList.remove('empty');
        cells[i2].num.textContent = String(1 + rnd(S.n));
      });
      var timer = setInterval(function () {
        roll.forEach(function (i3) { if (!locked.has(i3)) cells[i3].num.textContent = String(1 + rnd(S.n)); });
      }, 70);
      await sleep(reduce ? 200 : 1000);
      var order = shuffle(roll.slice());
      var gap = S.style === 'one' ? Math.min(180, Math.max(50, Math.round(2400 / Math.max(1, order.length)))) : 12;
      for (var q = 0; q < order.length; q++) {
        var idx = order[q];
        locked.add(idx);
        var el = cells[idx].el;
        el.classList.remove('rolling');
        var v = grid[idx];
        cells[idx].num.textContent = v > 0 ? String(v) : T('empty_mark');
        if (v === 0) el.classList.add('empty');
        if (!reduce) el.classList.add('pop');
        await sleep(gap);
      }
      clearInterval(timer);
      await sleep(reduce ? 0 : 350);
    }

    S.drawing = false;
    S.cur = N - 1;
    renderAll();
    var bad = [];
    results.forEach(function (x, k) { if (x.conflicts > 0) bad.push(letter(k)); });
    if (bad.length) {
      note(T('bad_note', bad), true);
    } else if (N > 1) {
      note(T('ready_n', N));
    } else {
      note(T('ready_one'));
    }
  }

  /* events */
  $('#start').addEventListener('click', startDraw);

  $('#confirm').addEventListener('click', function () {
    if (S.kind !== 'drawn' || S.drawing) return;
    var g = S.slides[S.cur];
    var pick = S.slides.length > 1 ? letter(S.cur) : '';
    S.prev = decode(encode(g));
    S.slides = [g]; S.cur = 0; S.kind = 'confirmed';
    save();
    renderAll();
    note(T('confirmed_note', pick));
  });

  $('#stageHost').addEventListener('click', function (e) {
    var b = e.target.closest('button.seat');
    if (!b || S.drawing) return;
    var i = Number(b.dataset.i);
    var k = keyOf(i);
    if (S.mode === 'seats') {
      if (S.disabled.has(k)) S.disabled.delete(k);
      else { S.disabled.add(k); S.fixed.delete(k); }
      changed(autoAdd());
    } else if (S.mode === 'fixed') {
      if (S.disabled.has(k)) return;
      S.selected = i;
      renderStage();
      renderEditor();
      var f = $('#fxNum');
      if (f) f.focus();
    }
  });

  $('#nav').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || S.drawing) return;
    if (b.dataset.go === 'prev') goTo(S.cur - 1, true);
    else if (b.dataset.go === 'next') goTo(S.cur + 1, true);
    else if (b.dataset.tab !== undefined) goTo(Number(b.dataset.tab), true);
  });

  function applyFixed() {
    if (S.selected < 0) return;
    var v = Number($('#fxNum').value);
    if (!Number.isInteger(v) || v < 1 || v > S.n) { note(T('fx_err', S.n), true); return; }
    Array.from(S.fixed).forEach(function (p) { if (p[1] === v) S.fixed.delete(p[0]); });
    S.fixed.set(keyOf(S.selected), v);
    var sel = S.selected;
    makeSample(); save(); renderAll();
    note(T('fx_done', v, seatName(sel)));
  }
  $('#fxSet').addEventListener('click', applyFixed);
  $('#fxNum').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); applyFixed(); } });
  $('#fxClear').addEventListener('click', function () {
    if (S.selected < 0) return;
    S.fixed.delete(keyOf(S.selected));
    makeSample(); save(); renderAll();
    note(T('fx_cleared'));
  });
  $('#fixedClear').addEventListener('click', function () {
    if (S.drawing) return;
    S.fixed.clear();
    changed(T('fx_all'));
  });

  document.addEventListener('click', function (e) {
    if (S.drawing) return;
    var sb = e.target.closest('.stepper button');
    if (sb) {
      var k = sb.parentNode.dataset.k;
      var lim = LIM[k];
      var v = Math.min(lim[1], Math.max(lim[0], S[k] + Number(sb.dataset.d)));
      if (v === S[k]) return;
      S[k] = v;
      if (k === 'rounds') { save(); renderControls(); return; }
      prune();
      changed(k === 'n' ? autoAdd() : '');
      return;
    }
    var seg = e.target.closest('.seg button');
    if (!seg) return;
    var id = seg.parentNode.id;
    var val = seg.dataset.v;
    if (id === 'modeSeg') { S.mode = val; S.selected = -1; renderAll(); }
    else if (id === 'styleSeg') { S.style = val; save(); renderControls(); }
    else if (id === 'langSeg') { S.lang = val; save(); applyStatic(); note(''); codeNote(''); renderAll(); }
  });

  $('#avoid').addEventListener('change', function (e) {
    S.avoid = e.target.checked;
    save();
    renderMeta();
  });

  $('#find').addEventListener('input', function () {
    if (S.mode !== 'view' && $('#find').value !== '') S.mode = 'view';
    renderAll();
  });

  /* record code */
  function codeNote(msg, warn) {
    var n = $('#codeNote');
    n.textContent = msg;
    n.classList.toggle('warn', !!warn);
  }
  $('#codeMake').addEventListener('click', async function () {
    var g = S.slides[S.cur];
    var ok = g && S.kind !== 'sample' && g.every(function (v) { return v >= 0; });
    if (!ok) { codeNote(T('code_first'), true); return; }
    var code = encode(g);
    var ta = $('#code');
    ta.value = code;
    try {
      await navigator.clipboard.writeText(code);
      codeNote(T('code_copied'));
    } catch (e) {
      ta.focus(); ta.select();
      codeNote(T('code_selected'));
    }
  });
  $('#codeLoad').addEventListener('click', function () {
    var p = decode($('#code').value);
    if (!p) { codeNote(T('code_bad'), true); return; }
    S.prev = p; S.avoidSrc = p;
    save();
    renderAll();
    codeNote(T('code_loaded', p.pos.size));
  });
  $('#codeClear').addEventListener('click', function () {
    S.prev = null; S.avoidSrc = null;
    save();
    renderAll();
    codeNote(T('code_cleared'));
  });

  /* start */
  S.lang = /^ja/i.test(navigator.language || '') ? 'ja' : 'en';
  load();
  applyStatic();
  if (!tryPrevAsResult()) makeSample();
  renderAll();
  if (S.kind === 'sample') note('');
  else if (S.kind === 'prev') note(T('prev_shown'));
})();
</script>
</body>
</html>
